<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Citation preview</title><style>
    :root {
      color-scheme: light;
      --bg: #f5f4f0;
      --bg-wash: #f5f4f0;
      --ink: #242724;
      --ink-muted: #72796f;
      --surface: #ffffff;
      --page: #ffffff;
      --line: #e3e6de;
      --accent: #24685c;
      --accent-hover: #1b5147;
      --accent-soft: #eaf2ed;
      --danger: #b44836;
      --user-bubble: #eaf2ed;
      --ai-bubble: #ffffff;
      --shadow-page: 0 2px 10px #2427240d;
      --font-sans: 'Source Sans 3', system-ui, -apple-system, sans-serif;
      --font-serif: 'Source Serif 4', Georgia, serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
      --radius: 12px;
      --topbar-h: 64px;
      --bg-dark: #f5f4f0;
      --bg-card: #ffffff;
      --bg-chat: #ffffff;
      --bg-input: #ffffff;
      --border: #e3e6de;
      --text: #242724;
      --text-muted: #72796f;
      --teal: #24685c;
      --teal-dark: #1b5147;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --slate-bubble-user: #eaf2ed;
      --slate-bubble-bot: #ffffff;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none; 
    }

    body {
      font-family: var(--font-sans);
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    document-qa-app {
      position: relative;
      z-index: 2;
    }
  
body {padding:20px;display:block;overflow:auto;} main {display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;height:calc(100vh - 140px);} document-preview {height:100%;} .right {overflow:auto;padding:15px;background:white;border-radius:12px;} h2 {font-family:Georgia,serif;margin:0 0 16px;} textarea {width:100%;margin-top:12px;min-height:62px;} @media(max-width:700px){main {grid-template-columns:1fr;height:auto;} document-preview{height:650px;}}</style></head><body><main><document-preview></document-preview><section class="right"><h2>Find the thread.</h2><document-chat-bubble id="question"></document-chat-bubble><document-chat-bubble id="answer"></document-chat-bubble></section></main><label>Copy check<textarea aria-label="Copy check"></textarea></label><script type="module" src="/.citation-preview.ts"></script></body></html>
