<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doc Q&amp;A</title>
  
  <!-- Fonts: Source Sans 3 (UI), Source Serif 4 (Document Reading), JetBrains Mono (Code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap"
    rel="stylesheet"
  />

  <!-- PWA Assets & Mobile Headers -->
  <link rel="icon" href="./icons/document-qa.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.json" crossorigin="use-credentials">

  <meta name="theme-color" content="#f5f4f0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f4f0;
      --bg-wash: #f5f4f0;
      --ink: #242724;
      --ink-muted: #72796f;
      --surface: #ffffff;
      --page: #ffffff;
      --line: #e3e6de;
      --accent: #24685c;
      --accent-hover: #1b5147;
      --accent-soft: #eaf2ed;
      --danger: #b44836;
      --user-bubble: #eaf2ed;
      --ai-bubble: #ffffff;
      --shadow-page: 0 2px 10px #2427240d;
      --font-sans: 'Source Sans 3', system-ui, -apple-system, sans-serif;
      --font-serif: 'Source Serif 4', Georgia, serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
      --radius: 12px;
      --topbar-h: 64px;
      --bg-dark: #f5f4f0;
      --bg-card: #ffffff;
      --bg-chat: #ffffff;
      --bg-input: #ffffff;
      --border: #e3e6de;
      --text: #242724;
      --text-muted: #72796f;
      --teal: #24685c;
      --teal-dark: #1b5147;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --slate-bubble-user: #eaf2ed;
      --slate-bubble-bot: #ffffff;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none; 
    }

    body {
      font-family: var(--font-sans);
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    document-qa-app {
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <!-- Centralized Lit Component App Shell -->
  <document-qa-app></document-qa-app>

  <!-- Mount the Lit Elements Entrypoint -->
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
